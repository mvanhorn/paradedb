[package]
name = "tokenizers"
version = { workspace = true }
edition = { workspace = true }


[dependencies]
anyhow = "1.0.102"
# INSTR-4902 fix: keep `compress` so the *embedded* loader still works for
# materialization. The materialized files we write to disk are decompressed
# rkyv/raw bytes — lindera-dictionary's FSDictionaryLoader reads them with
# the same `compress` feature flag, so loading from disk also works.
lindera = { version = "1.5.1", features = [
  "embedded-cc-cedict",
  "embedded-ipadic",
  "embedded-ko-dic",
  "compress",
] }
# Direct dep so we can call lindera_dictionary::dictionary::Dictionary::
# load_from_path_with_options with the `mmap` feature.
lindera-dictionary = { version = "1.5.1", features = ["mmap", "compress"] }
libc = "0.2"
once_cell = "1.21.4"
rkyv = "0.8"
serde = "1.0.228"
serde_json = "1.0.149"
tantivy.workspace = true
tracing = "0.1.44"
strum_macros = "0.27.2"
strum = { version = "0.27.2", features = ["derive"] }
tantivy-jieba = { workspace = true }
emoji = "0.2.1"
icu_properties = "2.2.0"
unicode-segmentation = "1.13.2"
icu_segmenter = "2.2.0"
opencc-jieba-rs = "0.7.2"

[dev-dependencies]
rstest = "0.25.0"

[package.metadata.cargo-machete]
ignored = ["strum"]
